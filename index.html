<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyBite</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" id="theme-color-meta" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EasyBite">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --bg:#fafafa; --card:#ffffff; --text:#1c1c22; --muted:#6b6b74;
    --border:#e6e6ea; --accent:#FF6B4A; --accent-soft:#fff0ec;
    --pill:#f0f0f2; --overlay:rgba(20,20,25,.45);
    --nav-active:#4d4d57;   /* selected nav tab (muted dark gray on light theme) */
    --ns-a:#1e8f4e; --ns-b:#7cb342; --ns-c:#f6c344; --ns-d:#f08c2e; --ns-e:#e5484d;
  }
  body[data-theme="dark"]{
    --bg:#121215; --card:#1c1c21; --text:#ececf0; --muted:#9a9aa4;
    --border:#2c2c33; --accent:#FF7D5C; --accent-soft:#33231e;
    --pill:#26262c; --overlay:rgba(0,0,0,.6);
    --nav-active:#565662;   /* selected nav tab (light gray on dark theme) */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45; transition:background .2s,color .2s;
  }
  button{font-family:inherit; cursor:pointer;}
  header.top{
    position:sticky; top:0; z-index:50; background:var(--card);
    border-bottom:1px solid var(--border); padding:8px 16px;
    display:grid; grid-template-columns:1fr minmax(0,auto) 1fr; align-items:center; gap:10px;
  }
  .logo{font-size:20px; font-weight:800; letter-spacing:-.5px; justify-self:start;}
  .logo b{color:var(--accent); font-weight:800;}
  .logo-mini{display:none;}
  .hdr-right{justify-self:end; display:flex; align-items:center; gap:8px;}
  .grow{flex:1;}
  nav.tabs{display:flex; gap:4px; background:var(--pill); padding:4px; border-radius:999px; justify-self:center;
    min-width:0; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    border:none; background:transparent; color:var(--muted); font-weight:600; white-space:nowrap;
    padding:7px 12px; border-radius:999px; font-size:14px; position:relative; transition:.15s; flex:none;
    display:inline-flex; align-items:center;
  }
  .tabicon{display:none; line-height:1;}
  nav.tabs button.active{background:var(--nav-active); color:#fff;}
  nav.tabs button:hover:not(.active){color:var(--text);}
  .navbadge{
    display:inline-flex; align-items:center; justify-content:center; vertical-align:middle;
    background:var(--ns-e); color:#fff; font-size:12px; font-weight:700;
    min-width:20px; height:20px; border-radius:999px; padding:0 6px; margin-left:6px;
  }
  .iconbtn{
    border:1px solid var(--border); background:var(--card); color:var(--text);
    border-radius:10px; padding:6px 10px; font-size:16px; line-height:1; transition:.15s; flex:none;
  }
  .iconbtn:hover{border-color:var(--accent);}
  /* header overflow menu */
  .menuwrap{position:relative; flex:none;}
  .menu{
    position:absolute; right:0; top:calc(100% + 6px); background:var(--card);
    border:1px solid var(--border); border-radius:12px; padding:8px; min-width:150px;
    display:none; flex-direction:column; gap:8px; z-index:60;
  }
  .menu.open{display:flex;}
  .menu .menuitem{display:flex; align-items:center; gap:8px; border:none; background:transparent;
    color:var(--text); padding:8px; border-radius:9px; font-size:14px; font-weight:600; text-align:left; width:100%;}
  .menu .menuitem:hover{background:var(--pill);}
  .menu-mobileonly{display:none; flex-direction:column; gap:8px; padding-bottom:8px; margin-bottom:2px; border-bottom:1px solid var(--border);}
  .langtoggle{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .langtoggle button{border:none; background:var(--card); color:var(--muted); padding:8px 12px; font-size:13px; font-weight:600; flex:1;}
  .langtoggle button.active{background:var(--accent); color:#fff;}
  main{max-width:1000px; margin:0 auto; padding:18px 16px 60px;}
  h2.viewtitle{margin:0 0 4px; font-size:22px; letter-spacing:-.4px;}
  .sub{color:var(--muted); margin:0 0 18px; font-size:14px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px;}
  /* summary bar */
  .summary{
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;
  }
  .stat{
    flex:1; min-width:120px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:12px 14px;
  }
  .stat .k{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  .stat .v{font-size:22px; font-weight:700; margin-top:2px; display:flex; align-items:center; gap:8px;}
  .btn{
    border:none; background:var(--accent); color:#fff; font-weight:600;
    padding:9px 16px; border-radius:10px; font-size:14px; transition:.15s;
  }
  .btn:hover{filter:brightness(1.05);}
  .btn.ghost{background:var(--pill); color:var(--text);}
  .btn.danger{background:var(--ns-e);}
  /* nutri badge */
  .ns{
    display:inline-flex; align-items:center; justify-content:center;
    width:24px; height:24px; border-radius:7px; color:#fff; font-weight:700; font-size:13px; flex:none;
  }
  .ns-A{background:var(--ns-a);} .ns-B{background:var(--ns-b);}
  .ns-C{background:var(--ns-c); color:#3a2e00;} .ns-D{background:var(--ns-d);} .ns-E{background:var(--ns-e);}
  .ns.sm{width:20px; height:20px; font-size:11px; border-radius:6px;}
  /* BiteScore badge (decimal, colour by band) */
  .score{
    display:inline-flex; align-items:center; justify-content:center; padding:0 8px; height:24px; min-width:34px;
    border-radius:8px; color:#fff; font-weight:700; font-size:13px; flex:none; letter-spacing:.2px;
  }
  .score.sm{height:20px; font-size:11px; padding:0 6px; min-width:30px; border-radius:6px;}
  /* rating sliders in the recipe editor */
  .raterow{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .raterow label{flex:none; width:96px; font-size:13px; color:var(--muted); font-weight:600; margin:0;}
  .raterow input[type=range]{flex:1; accent-color:var(--accent); height:22px;}
  .raterow .ratev{flex:none; width:22px; text-align:right; font-weight:700; font-size:14px;}
  /* ingredient list inside the plan-day modal */
  .ilist{display:flex; flex-direction:column;}
  .ilrow{display:flex; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px solid var(--border);
    cursor:pointer; border-radius:8px; transition:background .12s;}
  .ilrow:last-child{border-bottom:none;}
  .ilrow:active{background:var(--accent-soft);}
  .ilrow .iln{flex:1; font-weight:500;}
  .ilrow.on .iln{color:var(--muted);}
  .ilrow .ilq{color:var(--muted); font-size:13px;}
  /* month calendar */
  .calhead{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .calhead .mname{font-weight:700; font-size:18px; letter-spacing:-.3px; min-width:150px;}
  .calhead .navbtn{width:36px; height:36px; padding:0; font-size:18px; line-height:1;}
  .calhead .todaybtn{margin-left:auto;}
  .dowrow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px;}
  .dow{text-align:center; font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.4px;}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .mcell{
    border:1px solid var(--border); border-radius:11px; min-height:92px; padding:7px;
    display:flex; flex-direction:column; gap:3px; background:var(--card); transition:.15s; overflow:hidden;
  }
  .mcell.blank{border:none; background:transparent; min-height:0;}
  .mcell.day{cursor:pointer;}
  .mcell.day:hover{border-color:var(--accent);}
  .mcell.empty{border-style:dashed;}
  .mcell .dnum{font-size:12px; font-weight:700; color:var(--muted); line-height:1;}
  .mcell.today{border-color:var(--accent);}
  .mcell.today .dnum{color:var(--accent);}
  .mcell .ddish{font-size:11px; font-weight:600; line-height:1.15; flex:1; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;}
  .mcell .dfoot{display:flex; justify-content:flex-end;}
  .mcell.empty .plus{margin:auto; color:var(--muted); font-size:20px; opacity:.5;}
  .mcell.empty:hover .plus{opacity:1; color:var(--accent);}
  .mcell[data-draggable]{cursor:grab;}
  .mcell[data-draggable]:active{cursor:grabbing;}
  .mcell.past .ddish{text-decoration:line-through;}
  .mcell.past .ddish, .mcell.past .dfoot{opacity:.45;}
  .mcell.dragover{border-color:var(--accent); border-style:solid; background:var(--accent-soft);}
  .mcell.dragging{opacity:.4;}
  /* pointer-drag ghost (mouse + touch) */
  .pdrag-ghost{position:fixed; z-index:2000; pointer-events:none; opacity:.92; margin:0 !important;
    background:var(--card); outline:2px solid var(--accent); border-radius:11px;}
  body.pdrag-active{user-select:none; -webkit-user-select:none;}
  /* recipes */
  .cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px;}
  .rtoolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .iconmini{border:1px solid var(--border); background:var(--card); color:var(--muted); border-radius:9px;
    width:32px; height:32px; font-size:14px; line-height:1; transition:.15s; flex:none;}
  .iconmini:hover{border-color:var(--accent); color:var(--accent);}
  .iconmini.danger:hover{border-color:var(--ns-e); color:var(--ns-e);}
  .fhint{font-size:11px; color:var(--muted); margin-top:5px; line-height:1.35;}
  .nspick{display:flex; gap:8px;}
  .nspick-btn{width:44px; height:38px; border-radius:10px; font-size:16px; font-weight:700; border:2px solid transparent;
    opacity:.4; cursor:pointer; transition:.12s;}
  .nspick-btn:hover{opacity:.75;}
  .nspick-btn.sel{opacity:1; border-color:var(--text); transform:translateY(-1px);}
  .recipe{padding:14px; display:flex; flex-direction:column; gap:8px; cursor:pointer; transition:.15s;}
  .recipe:hover{border-color:var(--accent);}
  .recipe .rtop{display:flex; align-items:flex-start; gap:8px;}
  .recipe .rname{font-weight:700; font-size:16px; flex:1; line-height:1.2;}
  .recipe .rmeta{color:var(--muted); font-size:13px;}
  .chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:4px 9px; border-radius:999px; width:fit-content;}
  .chip.ok{background:rgba(30,143,78,.12); color:var(--ns-a);}
  .chip.miss{background:rgba(229,72,77,.12); color:var(--ns-e);}
  body[data-theme="dark"] .chip.ok{background:rgba(124,179,66,.18); color:#9ccf5f;}
  /* pantry */
  .catgroup{margin-bottom:18px;}
  .cathead{display:flex; align-items:center; gap:8px; font-weight:700; margin:0 0 8px; font-size:15px;}
  .cathead.cat-drag{
    cursor:grab; padding:8px 10px; border:1px solid var(--border); border-radius:10px;
    background:var(--card); user-select:none; transition:.12s; border-style:dashed;
    touch-action:none;   /* let the pointer-drag own the gesture instead of page scroll */
  }
  .cathead.cat-drag:hover{border-color:var(--accent); color:var(--accent);}
  .cathead.cat-drag:active{cursor:grabbing;}
  .cathead.cat-drag.dragging{opacity:.4;}
  .cathead.cat-drag.dragover{border-color:var(--accent); border-style:solid; background:var(--accent-soft);}
  .cathead .draghandle{color:var(--muted); font-size:16px; line-height:1; letter-spacing:-2px; cursor:grab;}
  .cathead.cat-drag:hover .draghandle{color:var(--accent);}
  .prow{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1px solid var(--border); border-radius:12px; margin-bottom:6px; background:var(--card);
  }
  .prow .pname{flex:1; font-weight:500;}
  .prow .punit{color:var(--muted); font-size:13px;}
  .sitem .rm-item{color:var(--muted); border-color:transparent; background:transparent;}
  .sitem .rm-item:hover{color:var(--ns-e); border-color:var(--ns-e); background:var(--card);}
  .stepper{display:flex; gap:6px;}
  .stepper button{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:18px; line-height:1; font-weight:600;
  }
  .stepper button:hover{border-color:var(--accent); color:var(--accent);}
  /* shopping */
  .progressbar{flex:1; height:6px; background:var(--pill); border-radius:999px; overflow:hidden; min-width:40px;}
  .progressfill{height:100%; background:var(--accent); border-radius:999px; transition:width .3s;}
  .progresslabel{font-size:12px; color:var(--muted); font-weight:600; flex:none;}
  .sitem{
    display:flex; align-items:center; gap:12px; padding:11px 12px;
    border:1px solid var(--border); border-radius:12px; margin-bottom:6px; background:var(--card); transition:.15s;
  }
  .sitem .sname{flex:1;}
  .sitem .sqty{color:var(--muted); font-size:14px;}
  .sitem.done{opacity:.55;}
  .sitem.done .sname{text-decoration:line-through;}
  .check{
    width:24px; height:24px; border-radius:7px; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer; transition:.15s;
    background:var(--card); color:transparent; font-size:15px; font-weight:700;
  }
  .check:hover{border-color:var(--accent);}
  .check.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .shoptools{display:flex; gap:10px; align-items:center; margin-bottom:14px;}
  .shoptools select.store{flex:none;}
  select.store, select.sel{
    border:1px solid var(--border); background:var(--card); color:var(--text);
    border-radius:10px; padding:9px 12px; font-size:16px; font-family:inherit;
  }
  .empty{color:var(--muted); text-align:center; padding:40px 20px;}
  /* modal */
  #overlay{position:fixed; inset:0; background:var(--overlay); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:24px 16px; overflow-y:auto;}
  #overlay.on{display:flex;}
  .modal{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    width:100%; max-width:460px; padding:20px; margin:auto;
  }
  .modal h3{margin:0 0 14px; font-size:19px; display:flex; align-items:center; gap:10px;}
  .modal-x{border:none; background:transparent; color:var(--muted); font-size:20px; line-height:1;
    padding:4px 6px; margin:-4px -6px -4px 0; cursor:pointer; flex:none; border-radius:8px;}
  .modal-x:hover{color:var(--text); background:var(--pill);}
  .modal h3 .grow{flex:1;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input, .field select{
    width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:10px; padding:9px 11px; font-size:16px; font-family:inherit;
  }
  .irow{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
  .irow select{flex:1;}
  .irow input{width:70px; flex:none;}
  .irow .unit{font-size:13px; color:var(--muted); min-width:34px;}
  .irow .rm{border:none; background:transparent; color:var(--ns-e); font-size:18px; padding:2px 6px;}
  .modalfoot{display:flex; gap:8px; margin-top:16px;}
  .modalfoot .grow{flex:1;}
  .rlist{display:flex; flex-direction:column; gap:6px; max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .rlist .ritem{
    display:flex; align-items:center; gap:10px; padding:13px 12px; border:1px solid var(--border);
    border-radius:11px; cursor:pointer; transition:.15s; background:var(--card);
  }
  .rlist .ritem:active{border-color:var(--accent); background:var(--accent-soft);}
  .rlist .ritem:hover{border-color:var(--accent);}
  .rlist .ritem .rn{flex:1; font-weight:600;}
  /* recipe picker: search + sort (mobile-first) */
  .pick-search{width:100%; box-sizing:border-box; border:1px solid var(--border); background:var(--bg);
    color:var(--text); border-radius:11px; padding:12px 14px; font-size:16px; font-family:inherit; margin-bottom:10px;}
  .pick-search:focus{outline:none; border-color:var(--accent);}
  .pick-sort{display:flex; align-items:center; gap:6px; margin-bottom:12px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .pick-sort::-webkit-scrollbar{display:none;}
  .pick-sortlbl{flex:none; font-size:12px; color:var(--muted); font-weight:600; margin-right:2px;}
  .pick-chip{flex:none; border:1px solid var(--border); background:var(--card); color:var(--muted);
    padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap; transition:.12s;}
  .pick-chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .pick-metric{flex:none; font-weight:700; font-size:15px; color:var(--accent); min-width:22px; text-align:right;}
  .pick-cat{flex:none; font-size:16px;}
  /* account / household modal */
  .glabel{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:16px 0 8px;}
  .ginrow{display:flex; gap:8px; align-items:center;}
  .ginrow .pick-search{margin:0; flex:1; min-width:0;}
  .gcode{font-size:26px; font-weight:800; letter-spacing:4px; text-align:center; padding:12px; margin-bottom:10px;
    border:1px dashed var(--border); border-radius:12px; background:var(--bg); font-family:ui-monospace,Menlo,Consolas,monospace;}
  .gmembers{display:flex; flex-direction:column; gap:6px;}
  .gmem{padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:14px; overflow-wrap:anywhere;}
  .gmsg{margin:10px 0 0; font-size:14px; font-weight:600; color:var(--accent);}
  .gstatus{font-size:13px; color:var(--muted); margin:-6px 0 4px;}
  .gstatus[data-s="synced"]{color:var(--ns-a);}
  .gstatus[data-s="offline"]{color:var(--ns-e);}
  /* sync dot on the ⋯ button while in a household */
  #menubtn{position:relative;}
  #menubtn::after{content:""; position:absolute; top:2px; right:2px; width:9px; height:9px; border-radius:50%;
    border:2px solid var(--card); display:none;}
  #menubtn[data-cloud="synced"]::after{display:block; background:var(--ns-a);}
  #menubtn[data-cloud="syncing"]::after, #menubtn[data-cloud="loading"]::after{display:block; background:var(--ns-c);}
  #menubtn[data-cloud="offline"]::after{display:block; background:var(--ns-e);}
  .linkbtn{border:none; background:transparent; color:var(--accent); font-weight:600; font-size:14px; padding:6px 0;}
  .bigtext{width:100%; min-height:120px; max-height:230px; border:1px solid var(--border); background:var(--bg);
    color:var(--text); border-radius:10px; padding:10px; font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:16px; line-height:1.4; resize:vertical; box-sizing:border-box;}
  @media(max-width:560px){
    .calgrid{gap:3px;} .dowrow{gap:3px;}
    .mcell{min-height:64px; padding:4px; border-radius:8px;}
    .mcell .ddish{font-size:9px; -webkit-line-clamp:2;}
    .mcell .dnum{font-size:11px;}
    .calhead .mname{font-size:16px; min-width:0;}
    nav.tabs{gap:2px;}
    nav.tabs button{padding:8px 12px;}
    .tabicon{display:inline-block; font-size:18px;}
    .tablabel{display:none;}
    .logo-full{display:none;}
    .logo-mini{display:inline;}
    #langtoggle{display:none;}
    #themebtn{display:none;}
    .menu-mobileonly{display:flex;}
  }
</style>
</head>
<body data-theme="light">
<header class="top">
  <div class="logo"><span class="logo-full">Easy<b>Bite</b></span><span class="logo-mini">E<b>B</b></span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="hdr-right">
    <div class="langtoggle" id="langtoggle"></div>
    <button class="iconbtn" data-action="theme" id="themebtn" aria-label="Theme">🌙</button>
    <div class="menuwrap">
      <button class="iconbtn" data-action="menu" id="menubtn" aria-label="Menu">⋯</button>
      <div class="menu" id="menu"></div>
    </div>
  </div>
</header>
<main id="app"></main>
<div id="overlay"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ */
/* Static catalog                                                     */
/* ------------------------------------------------------------------ */
const CATS = [
  {id:"vegetables", emoji:"🥦", en:"Vegetables",       sl:"Zelenjava"},
  {id:"fruit",      emoji:"🍎", en:"Fruit",            sl:"Sadje"},

const LS_KEY = "easybite.v3";
let state = load();
state.month = currentMonthStr();   // the plan always opens on the current month
let menuOpen = false;   // header overflow menu (language + theme); not persisted
const DEVICE_ID = (function(){ try{ let d=localStorage.getItem("easybite.device"); if(!d){ d=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem("easybite.device", d); } return d; }catch(e){ return "dev"+Math.random(); } })();
rebuildCatalog();   // ING = built-in seed + user's custom ingredients − deleted built-ins

// Rebuild the runtime catalog from the pristine seed plus the current state.
function rebuildCatalog(){
  for(const k of Object.keys(ING)) delete ING[k];
  Object.assign(ING, BUILTIN_ING, state.customIng || {});
  (state.hiddenIng || []).forEach(id=>{ delete ING[id]; });
}

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return migrate(Object.assign(defaultState(), parsed));
    }
  }catch(e){ /* ignore */ }
  return defaultState();
}
function migrate(s){
  // older recipes had no BiteScore ratings — default them to a neutral 5
  (s.recipes||[]).forEach(r=>{
    if(typeof r.ease!=="number")   r.ease=5;
    if(typeof r.taste!=="number")  r.taste=5;
    if(typeof r.health!=="number") r.health=5;
  });
  return s;
}
function save(){
  cloudQueue();   // in a shared group: queue changed recipes/days/items for upload (no-op otherwise)
  persist();      // local copy (personal data, or the group's offline cache)
}

/* Helpers                                                             */
/* ------------------------------------------------------------------ */
const tr = k => T[state.lang][k];
const nameOf = obj => obj ? (obj[state.lang] || obj.en) : "";
const catMeta = id => CATS.find(c=>c.id===id);
const catLabel = id => { const c=catMeta(id); return c ? c[state.lang] : id; };
const unitLabel = u => (UNITS[u] ? UNITS[u][state.lang] : u);
const recipeById = id => state.recipes.find(r=>r.id===id);
const activeStore = () => state.stores.find(s=>s.id===state.storeId) || state.stores[0] || defaultState().stores[0];
const capFirst = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

function fmtQty(q){
  const r = Math.round(q*100)/100;
  return Number.isInteger(r) ? String(r) : String(r);
}
function qtyUnit(ingId, q){ return fmtQty(q) + " " + unitLabel(ING[ingId].unit); }

/* Nutri-Score (A–E) — still used per ingredient in the catalog / shopping list */
const NS_VAL = {A:100,B:75,C:50,D:25,E:0};
function valueToLetter(v){ return v>=80?"A":v>=60?"B":v>=40?"C":v>=20?"D":"E"; }
function badge(letter, sm){
  if(!letter) return "";
  return `<span class="ns${sm?" sm":""} ns-${letter}">${letter}</span>`;
}

/* BiteScore — user-rated Ease / Taste / Health (each 1–10), weighted into one 1–10 score */
const BITE_W = {ease:0.2, taste:0.3, health:0.5};
function biteScore(r){
  if(!r || typeof r.health!=="number" || typeof r.taste!=="number" || typeof r.ease!=="number") return null;
  return BITE_W.ease*r.ease + BITE_W.taste*r.taste + BITE_W.health*r.health;
}
function scoreBand(v){ return v>=8?"A":v>=6.5?"B":v>=5?"C":v>=3.5?"D":"E"; }   // reuse the A–E colours
function scoreBadge(v, sm){
  if(v===null || v===undefined) return "";
  return `<span class="score${sm?" sm":""} ns-${scoreBand(v)}">${v.toFixed(1)}</span>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ------------------------------------------------------------------ */
/* Shopping computation                                                */
/* ------------------------------------------------------------------ */
function shoppingItems(){
  const items = [];
  Object.keys(state.list).forEach(ing=>{
    if(!ING[ing]) return;
    const q = state.list[ing];
    if(q > 0) items.push({ing, q, ticked: !!state.ticked[ing]});
  });
  return items;
}
function unticketedCount(){ return shoppingItems().filter(i=>!i.ticked).length; }
function addListItem(ing, q){
  if(!ING[ing]) return;
  state.list[ing] = (state.list[ing]||0) + (q||0);
  save();
}
function addAllMissing(recipeId){
  const r = recipeById(recipeId); if(!r) return 0;
  let n = 0;
  r.items.forEach(it=>{ if(ING[it.ing] && !(it.ing in state.list)){ state.list[it.ing] = (state.list[it.ing]||0) + it.q; n++; } });
  save();
  return n;
}
function removeListItem(ing){ delete state.list[ing]; delete state.ticked[ing]; save(); render(); }
function clearList(){ state.list = {}; state.ticked = {}; save(); render(); }

/* ------------------------------------------------------------------ */
/* Actions                                                             */
/* ------------------------------------------------------------------ */
function setView(v){
  if(v==="month") state.month = currentMonthStr();   // opening the plan snaps to this month
  state.view=v; closeModal(); save(); render();
}

function tickItem(ing){ state.ticked[ing] = true; save(); render(); }        // check off (bought)
function untickItem(ing){ delete state.ticked[ing]; save(); render(); }
function reorderCategory(fromCat, toCat){
  if(fromCat===toCat) return;
  const store = activeStore();
  let ord = (store.order||[]).slice();
  CAT_ORDER.forEach(c=>{ if(!ord.includes(c)) ord.push(c); }); // safety: keep all cats present
  ord.splice(ord.indexOf(fromCat), 1);
  ord.splice(ord.indexOf(toCat), 0, fromCat);                  // drop before the target
  store.order = ord;
  save(); render();
}
function assignSlot(slot, recipeId){
  if(recipeId) state.plan[slot]=recipeId; else delete state.plan[slot];
  closeModal(); save(); render();
}
function moveMeal(fromKey, toKey){
  if(fromKey===toKey) return;
  const a = state.plan[fromKey]; if(!a) return;
  const b = state.plan[toKey];
  if(b){ state.plan[fromKey]=b; state.plan[toKey]=a; }   // swap two days
  else { delete state.plan[fromKey]; state.plan[toKey]=a; } // move to empty day
  save(); render();
}

  const badgeN = unticketedCount();

function monthParts(){ const [y,m]=state.month.split("-").map(Number); return {y, m:m-1}; }
function pad2(n){ return String(n).padStart(2,"0"); }
function dateKey(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
function todayKey(){ const t=new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }
function shiftMonth(delta){
  let {y,m}=monthParts(); m+=delta;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  state.month=y+"-"+pad2(m+1); save(); render();
}

function renderMonth(){
  const {y,m}=monthParts();
  const prefix = y+"-"+pad2(m+1)+"-";
  const today = todayKey();
  const monthKeys = Object.keys(state.plan).filter(k=>k.startsWith(prefix) && recipeById(state.plan[k]));
  const values = monthKeys.map(k=>biteScore(recipeById(state.plan[k]))).filter(v=>v!==null);
  const monthAvg = values.length ? values.reduce((a,b)=>a+b,0)/values.length : null;
  const planned = monthKeys.filter(k=>k>=today).length;   // upcoming lunches only
  const toBuy = unticketedCount();

  const summary = `
    <div class="summary">
      <div class="stat"><div class="k">${tr("weekScore")}</div><div class="v">${monthAvg!==null?scoreBadge(monthAvg):"–"}</div></div>
      <div class="stat"><div class="k">${tr("plannedMeals")}</div><div class="v">${planned}</div></div>
      <div class="stat"><div class="k">${tr("toBuy")}</div><div class="v">${toBuy}</div></div>
    </div>`;

  const monthName = capFirst(MONTHS[state.lang][m]);
  const calHead = `<div class="calhead">
    <button class="iconbtn navbtn" data-action="month-prev">‹</button>
    <div class="mname">${monthName} ${y}</div>
    <button class="iconbtn navbtn" data-action="month-next">›</button>
    <button class="btn ghost todaybtn" data-action="month-today">${tr("today")}</button>
  </div>`;

  const dowRow = `<div class="dowrow">${DAYS.map(d=>`<div class="dow">${d[state.lang]}</div>`).join("")}</div>`;

  const startDow = (new Date(y,m,1).getDay()+6)%7;   // Monday-first offset
  const daysIn = new Date(y,m+1,0).getDate();
  let cells = "";
  for(let i=0;i<startDow;i++) cells += `<div class="mcell blank"></div>`;
  for(let d=1; d<=daysIn; d++){
    const key = dateKey(y,m,d);
    const rid = state.plan[key];
    const r = rid ? recipeById(rid) : null;
    const todayCls = key===today ? " today" : "";
    const pastCls = key<today ? " past" : "";
    if(r){
      cells += `<div class="mcell day${todayCls}${pastCls}" data-draggable="1" data-action="slot" data-slot="${key}">
        <div class="dnum">${d}</div>
        <div class="ddish">${escapeHtml(nameOf(r.name))}</div>
        <div class="dfoot">${scoreBadge(biteScore(r), true)}</div>
      </div>`;
    }else{
      cells += `<div class="mcell day empty${todayCls}" data-action="slot" data-slot="${key}">
        <div class="dnum">${d}</div><div class="plus">+</div>
      </div>`;
    }
  }

  return `<h2 class="viewtitle">${tr("weekTitle")}</h2><p class="sub">${tr("weekSub")}</p>
    ${summary}${calHead}${dowRow}<div class="calgrid">${cells}</div>`;
}

function renderShopping(){
  const items = shoppingItems();
  const store = activeStore();
  const total = items.length;
  const done = items.filter(i=>i.ticked).length;
  const pct = total ? Math.round(done/total*100) : 0;

  const storeSel = `<select class="store" data-action="store">
    ${state.stores.map(s=>`<option value="${s.id}" ${s.id===state.storeId?"selected":""}>${escapeHtml(s.name)}</option>`).join("")}
  </select>`;

  if(!total){
    return `<div class="shoptools">${storeSel}</div><div class="empty">${tr("emptyList")}</div>`;
  }

  // store selector + progress bar + clear, one compact row
  const tools = `<div class="shoptools">
    ${storeSel}
    <div class="progressbar"><div class="progressfill" style="width:${pct}%;"></div></div>
    <span class="progresslabel">${done}/${total}</span>
    <button class="iconmini danger" data-action="clear-list" title="${tr("clearList")}">🗑</button>
  </div>`;

  // group by category
  const groups = {};
  items.forEach(it=>{ const c=ING[it.ing].cat; (groups[c]=groups[c]||[]).push(it); });
  const rank = c => { const i=(store.order||[]).indexOf(c); return i<0 ? 999 : i; };
  const cats = Object.keys(groups).sort((a,b)=>{
    const ra=rank(a), rb=rank(b);
    return ra===rb ? catLabel(a).localeCompare(catLabel(b)) : ra-rb;
  });

  const body = cats.map(cat=>{
    const meta = catMeta(cat);
    const list = groups[cat].slice().sort((a,b)=> (a.ticked===b.ticked)?0:(a.ticked?1:-1));
    const rows = list.map(it=>{
      const ing = ING[it.ing];
      return `<div class="sitem ${it.ticked?"done":""}">
        <div class="check ${it.ticked?"on":""}" data-action="${it.ticked?"untick":"tick"}" data-ing="${it.ing}">✓</div>
        ${badge(ing.ns, true)}
        <div class="sname">${escapeHtml(nameOf(ing.name))}</div>
        <div class="sqty">${qtyUnit(it.ing, it.q)}</div>
        <button class="iconmini rm-item" data-action="remove-item" data-ing="${it.ing}" title="${tr("removeItem")}">✕</button>
      </div>`;
    }).join("");
    return `<div class="catgroup" data-cat="${cat}">
      <div class="cathead cat-drag" data-cat="${cat}">
        <span class="draghandle" aria-hidden="true">⠿</span>${meta.emoji} ${meta[state.lang]}
      </div>${rows}</div>`;
  }).join("");

  return `${tools}${body}`;
}

function saveRecipe(){
  captureRecipeForm();
  const name = editing.name.trim() || (state.lang==="sl"?"Recept":"Recipe");
  const items = editing.items.filter(it=>it.q>0);
  const rt = {ease:editing.ease, taste:editing.taste, health:editing.health};
  if(editing.id && recipeById(editing.id)){
    const r = recipeById(editing.id);
    r.name = {en:name, sl:name}; r.servings=editing.servings; r.items=items;
    r.ease=rt.ease; r.taste=rt.taste; r.health=rt.health;
  }else if(editing.id){
    state.recipes.push(Object.assign({id:editing.id, name:{en:name, sl:name}, servings:editing.servings, items}, rt));
  }else{
    const id = "r"+Date.now();
    state.recipes.push(Object.assign({id, name:{en:name, sl:name}, servings:editing.servings, items}, rt));
  }
  closeModal(); save(); render();
}
function deleteRecipe(id){
  state.recipes = state.recipes.filter(r=>r.id!==id);
  Object.keys(state.plan).forEach(k=>{ if(state.plan[k]===id) delete state.plan[k]; });
  closeModal(); save(); render();
}

async function autoScoreLookup(){
  captureIngredientForm();
  const name = (editingIng.name||"").trim();
  if(!name){ const el=overlay.querySelector("#ing-name"); if(el){ el.style.borderColor="var(--ns-e)"; el.focus(); } return; }
  editingIng.nsBusy = true; editingIng.nsStatus = tr("searching"); renderIngredientModal();
  const target = editingIng;   // guard against modal being closed/replaced mid-request
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 8000);
    const url = "https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(name)
      +"&json=1&page_size=10&fields=product_name,nutriscore_grade";
    const res = await fetch(url, {signal:ctrl.signal});
    clearTimeout(timer);
    const data = await res.json();
    const prod = (data.products||[]).find(p=>/^[a-e]$/.test((p.nutriscore_grade||"").toLowerCase()));
    if(editingIng!==target) return;   // user moved on
    if(prod){
      editingIng.ns = prod.nutriscore_grade.toUpperCase();
      editingIng.nsStatus = tr("matched")+": "+(prod.product_name||name)+" → "+editingIng.ns;
    }else{
      editingIng.nsStatus = tr("noMatch");
    }
  }catch(e){
    if(editingIng===target) editingIng.nsStatus = tr("lookupFail");
  }
  if(editingIng===target){ editingIng.nsBusy = false; renderIngredientModal(); }
}
function saveIngredient(){
  captureIngredientForm();
  const name = (editingIng.name||"").trim();
  if(!name){ const el=overlay.querySelector("#ing-name"); if(el){ el.style.borderColor="var(--ns-e)"; el.focus(); } return; }
  const g = editingIng.g>0 ? editingIng.g : defaultG(editingIng.unit);
  const ns = editingIng.ns || "C";
  if(editingIng.id){
    const ing = ING[editingIng.id];
    ing.name = {en:name, sl:name}; ing.cat = editingIng.cat; ing.unit = editingIng.unit; ing.g = g; ing.ns = ns;
    state.customIng[editingIng.id] = ing;
  }else{
    const id = "c"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
    const ing = {name:{en:name, sl:name}, cat:editingIng.cat, unit:editingIng.unit, g, ns, custom:true};
    ING[id] = ing; state.customIng[id] = ing;
  }
  editingIng = null; closeModal(); save(); render();
}
function confirmDeleteIngredient(id){

  openModal(`<h3>${tr("deleteIngTitle")}</h3>
    <p class="sub" style="margin:0 0 4px;">${badge(ing.ns, true)} ${escapeHtml(nameOf(ing.name))}</p>

function deleteIngredient(id){
  if(!ING[id]) return;
  const wasCustom = ING[id].custom;
  delete ING[id];
  if(wasCustom) delete state.customIng[id];
  else { if(!state.hiddenIng.includes(id)) state.hiddenIng.push(id); }   // built-in: remember it's gone
  delete state.list[id]; delete state.ticked[id];
  state.recipes.forEach(r=>{ r.items = r.items.filter(it=>it.ing!==id); });
  editingIng = null; closeModal(); save(); render();
}

/* Accounts & shared groups (Supabase). Off until SUPABASE_* are set.  */
/* ------------------------------------------------------------------ */
// From Supabase → Project Settings → API. Both values are safe to publish
// (access is enforced by the row-level-security rules in supabase/schema.sql).
const SUPABASE_URL = "https://gczhaagsvgkfoyseqmuj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_6PkgZlDcXYweRkDEokJvzg_YD9IMplh";
const cloudEnabled = () => !!(SUPABASE_URL && SUPABASE_ANON_KEY);

let sb = null;                 // supabase client
let authUser = null;           // signed-in user (or null)
let sessionUid;                // uid we last handled (undefined = not yet known)
let groups = [];               // groups the user belongs to
let activeGroup = null;        // {id,name,invite_code} or null = personal/local data
let members = [];              // members of the active group
let rtChannel = null;          // realtime subscription
let lastSynced = new Map();    // "kind|key" -> stable JSON the server has (null = deleted)
let outbox = new Map();        // "kind|key" -> data not yet confirmed by the server
let inflight = new Map();      // rows currently being uploaded
let flushTimer = null, flushing = false, pulling = false;
let cloudStatus = "off";       // off | signedout | loading | syncing | synced | offline
let groupModalOpen = false, groupMsg = "", leaveArmed = false;
let needGroups = false;        // group list couldn't be fetched (offline) — retry when back online
const PREF_KEYS = ["view","lang","theme","month","storeId"];   // per-device, never shared

function loadScript(src){ return new Promise((res,rej)=>{ const el=document.createElement("script"); el.src=src; el.onload=()=>res(); el.onerror=()=>rej(new Error("load "+src)); document.head.appendChild(el); }); }
function readKey(k){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):null; }catch(e){ return null; } }
function writeKey(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function pickPrefs(s){ const p={}; PREF_KEYS.forEach(k=>{ if(s[k]!==undefined) p[k]=s[k]; }); return p; }
function emptyShared(){ return {recipes:[], plan:{}, list:{}, ticked:{}, customIng:{}, hiddenIng:[], stores:[]}; }
function ensureStores(){ if(state.stores && state.stores.length) return false; state.stores = defaultState().stores; return true; }
function stable(v){                       // JSON with sorted keys — jsonb reorders object keys
  if(v===null || typeof v!=="object") return JSON.stringify(v);
  if(Array.isArray(v)) return "["+v.map(stable).join(",")+"]";
  return "{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}";
}

/* state <-> rows: every recipe / planned day / list item / … is its own row */
function sharedMap(s){
  const m = new Map();
  (s.recipes||[]).forEach(r=>m.set("recipe|"+r.id, r));
  Object.keys(s.plan||{}).forEach(d=>m.set("plan|"+d, {r:s.plan[d]}));
  Object.keys(s.list||{}).forEach(i=>m.set("list|"+i, {q:s.list[i], t:!!(s.ticked||{})[i]}));
  Object.keys(s.customIng||{}).forEach(i=>m.set("ing|"+i, s.customIng[i]));
  (s.hiddenIng||[]).forEach(i=>m.set("hidden|"+i, {h:1}));
  (s.stores||[]).forEach(st=>m.set("store|"+st.id, st));
  return m;
}
function applyEntry(kind, key, data){
  const del = data===null || data===undefined;
  const upsertById = (arr, obj)=>{ const i=arr.findIndex(x=>x.id===key);
    if(del){ if(i>=0) arr.splice(i,1); } else { const o=Object.assign({}, obj, {id:key}); if(i>=0) arr[i]=o; else arr.push(o); } };
  switch(kind){
    case "recipe": upsertById(state.recipes, data); break;
    case "store":  upsertById(state.stores, data); break;
    case "plan":   if(del) delete state.plan[key]; else state.plan[key]=data.r; break;
    case "list":
      if(del){ delete state.list[key]; delete state.ticked[key]; }
      else { state.list[key]=data.q; if(data.t) state.ticked[key]=true; else delete state.ticked[key]; }
      break;
    case "ing":    if(del) delete state.customIng[key]; else state.customIng[key]=Object.assign({}, data); break;
    case "hidden": { const i=state.hiddenIng.indexOf(key); if(del){ if(i>=0) state.hiddenIng.splice(i,1); } else if(i<0) state.hiddenIng.push(key); break; }
  }
}

/* local persistence: personal data under LS_KEY, each group cached separately */
function persist(){
  try{
    if(activeGroup){
      const g = activeGroup.id;
      localStorage.setItem("easybite.g."+g, JSON.stringify(state));
      localStorage.setItem("easybite.gs."+g, JSON.stringify([...lastSynced]));
      const ob = new Map(inflight); outbox.forEach((d,k)=>ob.set(k,d));
      localStorage.setItem("easybite.go."+g, JSON.stringify([...ob]));
    } else {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    }
  }catch(e){}
}

/* outgoing: diff the state against what the server has, queue changed rows */
function cloudQueue(){
  if(!activeGroup) return;
  const cur = sharedMap(state);
  cur.forEach((v,k)=>{ const j=stable(v); if(lastSynced.get(k)!==j){ outbox.set(k, v); lastSynced.set(k, j); } });
  lastSynced.forEach((j,k)=>{ if(j!==null && !cur.has(k)){ outbox.set(k, null); lastSynced.set(k, null); } });
  if(outbox.size){ if(cloudStatus==="synced") setCloudStatus("syncing"); clearTimeout(flushTimer); flushTimer = setTimeout(cloudFlush, 300); }
}
async function cloudFlush(){
  if(!activeGroup || !sb || !authUser || flushing || !outbox.size) return;
  flushing = true;
  const gid = activeGroup.id;
  inflight = outbox; outbox = new Map();
  const rows = [...inflight].map(([k,data])=>{ const p=k.indexOf("|"); return {group_id:gid, kind:k.slice(0,p), key:k.slice(p+1), data, device:DEVICE_ID}; });
  try{
    for(let i=0; i<rows.length; i+=500){
      const { error } = await sb.from("entries").upsert(rows.slice(i, i+500), {onConflict:"group_id,kind,key"});
      if(error) throw error;
    }
    inflight = new Map();
    if(activeGroup && activeGroup.id===gid){ persist(); setCloudStatus(outbox.size ? "syncing" : "synced"); }
  }catch(e){
    const failed = inflight; inflight = new Map();
    if(activeGroup && activeGroup.id===gid){
      failed.forEach((d,k)=>{ if(!outbox.has(k)) outbox.set(k,d); });
      persist();
      setCloudStatus("offline");
      clearTimeout(flushTimer); flushTimer = setTimeout(cloudFlush, 8000);
    } else {                                   // switched groups meanwhile: park them with their group
      const ob = new Map(readKey("easybite.go."+gid)||[]); failed.forEach((d,k)=>{ if(!ob.has(k)) ob.set(k,d); });
      writeKey("easybite.go."+gid, [...ob]);
    }
  }finally{
    flushing = false;
    if(outbox.size && cloudStatus!=="offline"){ clearTimeout(flushTimer); flushTimer = setTimeout(cloudFlush, 300); }
  }
}

/* incoming: full pull (on enter / reconnect) and live row events */
async function fetchEntries(gid){
  const all = [], size = 1000;
  for(let from=0;; from+=size){
    const { data, error } = await sb.from("entries").select("kind,key,data").eq("group_id", gid).range(from, from+size-1);
    if(error) throw error;
    all.push(...data);
    if(data.length < size) break;
  }
  return all;
}
function entityValue(kind, key){              // one entity as sharedMap() would produce it
  switch(kind){
    case "recipe": return state.recipes.find(r=>r.id===key) || null;
    case "store":  return state.stores.find(s=>s.id===key) || null;
    case "plan":   return key in state.plan ? {r:state.plan[key]} : null;
    case "list":   return key in state.list ? {q:state.list[key], t:!!state.ticked[key]} : null;
    case "ing":    return state.customIng[key] || null;
    case "hidden": return state.hiddenIng.includes(key) ? {h:1} : null;
  }
  return null;
}
function takeRow(row){                         // returns true if state changed
  const k = row.kind+"|"+row.key;
  if(outbox.has(k) || inflight.has(k)) return false;   // our newer local change wins
  const j = row.data===null ? null : stable(row.data);
  if(lastSynced.has(k) && lastSynced.get(k)===j) return false;
  applyEntry(row.kind, row.key, row.data);
  const v = entityValue(row.kind, row.key);    // record it canonically so it isn't echoed back
  lastSynced.set(k, v===null ? null : stable(v));
  return true;
}
function afterRemote(changed){
  if(!changed) return;
  rebuildCatalog(); migrate(state);
  persist(); scheduleRender();
}
async function groupPull(gid){
  if(!sb || !authUser || pulling) return;
  pulling = true;
  try{
    const rows = await fetchEntries(gid);
    if(!activeGroup || activeGroup.id!==gid) return;
    let changed = false;
    rows.forEach(r=>{ if(takeRow(r)) changed = true; });
    if(ensureStores()){ changed = true; cloudQueue(); }
    afterRemote(changed); persist();
    setCloudStatus(outbox.size ? "syncing" : "synced");
  }catch(e){ setCloudStatus("offline"); }
  finally{ pulling = false; }
}
function onRemote(payload){
  const row = payload && payload.new;
  if(!row || !activeGroup || row.group_id!==activeGroup.id || row.device===DEVICE_ID) return;
  afterRemote(takeRow(row));
}
let renderQueued = false;
function scheduleRender(){ if(renderQueued) return; renderQueued = true; requestAnimationFrame(()=>{ renderQueued = false; render(); renderGroupIfOpen(); }); }

function unsubscribe(){ if(rtChannel && sb){ try{ sb.removeChannel(rtChannel); }catch(e){} } rtChannel = null; }
function subscribeGroup(gid){
  unsubscribe();
  rtChannel = sb.channel("entries-"+gid)
    .on("postgres_changes", {event:"*", schema:"public", table:"entries", filter:"group_id=eq."+gid}, onRemote)
    .subscribe(status=>{
      if(status==="SUBSCRIBED") groupPull(gid);                 // catch up anything missed while away
      else if(status==="CHANNEL_ERROR" || status==="TIMED_OUT") setCloudStatus("offline");
    });
}

/* switching between personal data and groups */
function activeKey(){ return authUser ? "easybite.ag."+authUser.id : null; }
function setActiveGroupId(id){ const k=activeKey(); if(!k) return; if(id) writeKey(k, id); else try{ localStorage.removeItem(k); }catch(e){} }

async function enterGroup(g, opts){
  opts = opts || {};
  if(!activeGroup || activeGroup.id!==g.id){
    if(activeGroup) persist();
    unsubscribe(); clearTimeout(flushTimer);
    const prefs = pickPrefs(state);
    activeGroup = g;
    if(opts.seed){                             // brand-new group starts with my current data
      lastSynced = new Map(); outbox = new Map();
    } else {
      const cached = readKey("easybite.g."+g.id);
      state = migrate(Object.assign(defaultState(), emptyShared(), cached||{}, prefs));
      lastSynced = new Map(readKey("easybite.gs."+g.id)||[]);
      outbox = new Map(readKey("easybite.go."+g.id)||[]);
      rebuildCatalog();
    }
  } else {
    activeGroup = Object.assign(activeGroup, g);
  }
  writeKey("easybite.lastGroup", {id:g.id, name:g.name, invite_code:g.invite_code});
  setActiveGroupId(g.id);
  if(opts.seed) cloudQueue();
  persist(); render();
  setCloudStatus("loading");
  subscribeGroup(g.id);
  await groupPull(g.id);
  cloudFlush();
  loadMembers();
}
function leaveToLocal(){
  if(activeGroup) persist();
  unsubscribe(); clearTimeout(flushTimer);
  const prefs = pickPrefs(state);
  activeGroup = null; members = []; lastSynced = new Map(); outbox = new Map(); inflight = new Map();
  try{ localStorage.removeItem("easybite.lastGroup"); }catch(e){}
  state = Object.assign(load(), prefs);
  rebuildCatalog(); render();
  setCloudStatus(authUser ? "synced" : "signedout");
}
function clearGroupCaches(){
  try{ Object.keys(localStorage).forEach(k=>{ if(/^easybite\.(g|gs|go|ag)\./.test(k) || k==="easybite.lastGroup") localStorage.removeItem(k); }); }catch(e){}
}

/* auth + group actions */
function takePendingJoin(){ const c=readKey("easybite.join"); try{ localStorage.removeItem("easybite.join"); }catch(e){} return c; }
async function loadGroups(){
  try{
    const { data, error } = await sb.from("groups").select("id,name,invite_code,created_at").order("created_at");
    if(error) return false;
    groups = data || []; return true;
  }catch(e){ return false; }
}
async function loadMembers(){
  if(!activeGroup || !sb) return;
  const { data } = await sb.from("group_members").select("user_id,email,joined_at").eq("group_id", activeGroup.id).order("joined_at");
  members = data || []; renderGroupIfOpen();
}
async function handleSession(session){
  const u = session ? session.user : null, uid = u ? u.id : null;
  authUser = u;
  if(uid === sessionUid) return;
  sessionUid = uid;
  if(!u){
    if(activeGroup) leaveToLocal();
    setCloudStatus("signedout"); renderHeader();
    if(readKey("easybite.join")){ groupMsg = tr("signInToJoin"); openGroupModal(true); }
    return;
  }
  setCloudStatus("loading");
  if(!(await loadGroups())){                   // offline: keep showing the cached household, retry later
    needGroups = true; setCloudStatus(activeGroup ? "offline" : "synced"); renderHeader(); renderGroupIfOpen(); return;
  }
  needGroups = false;
  const pending = takePendingJoin();
  if(pending){ await joinGroup(pending); return; }
  const want = readKey(activeKey());
  const g = groups.find(x=>x.id===want) || (activeGroup && groups.find(x=>x.id===activeGroup.id));
  if(g) await enterGroup(g);
  else { if(activeGroup) leaveToLocal(); setCloudStatus("synced"); }
  renderHeader(); renderGroupIfOpen();
}
async function cloudAuth(email, pw, isNew){
  if(!sb){ groupMsg = tr("noServer"); renderGroupIfOpen(); return; }
  if(!email || !pw || pw.length < 6){ groupMsg = tr("authNeed"); renderGroupIfOpen(); return; }
  groupMsg = tr("syncSigningIn"); renderGroupIfOpen();
  const join = readKey("easybite.join");
  const back = location.origin + location.pathname + (join ? "?join="+encodeURIComponent(join) : "");
  const res = isNew
    ? await sb.auth.signUp({email, password:pw, options:{emailRedirectTo:back}})
    : await sb.auth.signInWithPassword({email, password:pw});
  if(res.error){
    const m = res.error.message || "";
    groupMsg = /already/i.test(m) ? tr("alreadyReg") : /confirm/i.test(m) ? tr("checkEmail")
      : /database error|not_allowed/i.test(m) ? tr("notAllowed") : isNew ? m : tr("syncAuthError");
  } else if(isNew && !res.data.session){
    groupMsg = tr("checkEmail");
  } else groupMsg = "";
  renderGroupIfOpen();
}
async function cloudSignOut(){
  leaveToLocal();
  clearGroupCaches();
  try{ await sb.auth.signOut(); }catch(e){}
  authUser = null; sessionUid = null; groups = []; groupMsg = "";
  setCloudStatus("signedout"); renderHeader(); renderGroupIfOpen();
}
async function createGroup(name){
  name = (name||"").trim();
  if(!name){ groupMsg = tr("groupNameNeeded"); renderGroupIfOpen(); return; }
  const { data, error } = await sb.rpc("create_group", {p_name:name});
  if(error || !data){ groupMsg = tr("groupError"); renderGroupIfOpen(); return; }
  groups.push(data); groupMsg = "";
  await enterGroup(data, {seed:true});
  renderGroupIfOpen();
}
async function joinGroup(code){
  code = (code||"").trim().toUpperCase();
  if(!code) return;
  const { data, error } = await sb.rpc("join_group", {p_code:code});
  if(error || !data){ groupMsg = tr("badCode"); setCloudStatus(activeGroup ? cloudStatus : "synced"); openGroupModal(true); return; }
  await loadGroups(); groupMsg = "";
  await enterGroup(groups.find(g=>g.id===data.id) || data);
  renderHeader(); renderGroupIfOpen();
}
async function switchGroup(id){ const g = groups.find(x=>x.id===id); if(g){ await enterGroup(g); renderGroupIfOpen(); } }
function goPersonal(){ setActiveGroupId(null); leaveToLocal(); renderGroupIfOpen(); }
async function leaveGroup(){
  if(!activeGroup || !sb) return;
  const gid = activeGroup.id;
  const { error } = await sb.from("group_members").delete().eq("group_id", gid).eq("user_id", authUser.id);
  if(error){ groupMsg = tr("groupError"); renderGroupIfOpen(); return; }
  groups = groups.filter(g=>g.id!==gid);
  setActiveGroupId(null); leaveToLocal();
  ["g","gs","go"].forEach(p=>{ try{ localStorage.removeItem("easybite."+p+"."+gid); }catch(e){} });
  renderGroupIfOpen();
}
async function shareInvite(){
  if(!activeGroup) return;
  const url = location.origin + location.pathname + "?join=" + activeGroup.invite_code;
  const text = tr("inviteText") + " „" + activeGroup.name + "“";
  if(navigator.share){
    try{ await navigator.share({title:"EasyBite", text, url}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  try{ await navigator.clipboard.writeText(url); groupMsg = tr("linkCopied"); }catch(e){ groupMsg = url; }
  renderGroupIfOpen();
}

/* boot: invite links, cached group for instant/offline start, then connect */
let cloudLoading = false;
async function cloudInit(){
  if(sb || cloudLoading) return;
  cloudLoading = true;
  try{ await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"); }
  catch(e){ cloudLoading = false; setCloudStatus(activeGroup ? "offline" : "off"); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
    {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:"implicit"}});
  sb.auth.onAuthStateChange((event, session)=>{ setTimeout(()=>handleSession(session), 0); });
  const { data } = await sb.auth.getSession();
  await handleSession(data.session);
  cloudLoading = false;
}
async function cloudResync(){
  if(!sb) return cloudInit();
  if(needGroups){ sessionUid = undefined; const { data } = await sb.auth.getSession(); return handleSession(data.session); }
  if(activeGroup){ groupPull(activeGroup.id); cloudFlush(); }
}
function cloudBoot(){
  try{
    const p = new URLSearchParams(location.search), c = p.get("join");
    if(c){ writeKey("easybite.join", c.trim().toUpperCase()); p.delete("join");
      history.replaceState(null, "", location.pathname + (p.toString() ? "?"+p : "") + location.hash); }
  }catch(e){}
  if(!cloudEnabled()) return;
  const last = readKey("easybite.lastGroup");
  if(last && last.id){                       // show the household's cached data right away (works offline)
    const prefs = pickPrefs(state);
    activeGroup = last;
    state = migrate(Object.assign(defaultState(), emptyShared(), readKey("easybite.g."+last.id)||{}, prefs));
    lastSynced = new Map(readKey("easybite.gs."+last.id)||[]);
    outbox = new Map(readKey("easybite.go."+last.id)||[]);
    rebuildCatalog();
    cloudStatus = "loading";
  }
  window.addEventListener("online", cloudResync);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") cloudResync(); });
  cloudInit();
}

function cloudStatusText(){

function renderGroupIfOpen(){ if(groupModalOpen) renderGroupModal(); }

function gval(id, raw){ const el = overlay.querySelector("#"+id); return el ? (raw ? el.value : el.value.trim()) : ""; }

/* ------------------------------------------------------------------ */
/* Root render                                                         */
/* ------------------------------------------------------------------ */
function render(){
  document.documentElement.lang = state.lang;
  document.body.setAttribute("data-theme", state.theme);
  const tcm = document.getElementById("theme-color-meta");
  if(tcm) tcm.content = state.theme==="dark" ? "#1c1c21" : "#ffffff";
  renderHeader();
  const app = document.getElementById("app");
  if(state.view==="month") app.innerHTML = renderMonth();
  else if(state.view==="recipes") app.innerHTML = renderRecipes();
  else if(state.view==="kitchen") app.innerHTML = renderKitchen();
  else if(state.view==="shopping") app.innerHTML = renderShopping();
}

/* ------------------------------------------------------------------ */
/* Event delegation                                                    */
/* ------------------------------------------------------------------ */
document.addEventListener("click", e=>{
  if(Date.now()-lastDragEnd < 350) return;   // ignore the click fired right after a drag drop
  // close the header overflow menu on any click outside it
  if(menuOpen && !e.target.closest(".menuwrap")){
    menuOpen=false; const m=document.getElementById("menu"); if(m) m.classList.remove("open");
  }
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const a = el.dataset.action;
  switch(a){
    case "view": setView(el.dataset.view); break;
    case "menu": menuOpen=!menuOpen; document.getElementById("menu").classList.toggle("open", menuOpen); break;
    case "lang": menuOpen=false; state.lang=el.dataset.lang; save(); render(); break;
    case "theme": menuOpen=false; state.theme = state.theme==="dark"?"light":"dark"; save(); render(); break;
    case "month-prev": shiftMonth(-1); break;
    case "month-next": shiftMonth(1); break;
    case "month-today": state.month=currentMonthStr(); save(); render(); break;
    case "slot": openSlotModal(el.dataset.slot); break;
    case "assign": assignSlot(el.dataset.slot, el.dataset.recipe||""); break;
    case "new-recipe": openRecipeModal(null); break;
    case "edit-recipe": openRecipeModal(el.dataset.id); break;
    case "add-ing": captureRecipeForm(); openRecipeIngPicker(); break;
    case "pick-recipe-ing": { const id=el.dataset.ing; const u=ING[id].unit; editing.items.push({ing:id, q:(u==="g"||u==="ml")?100:1}); renderRecipeModal(); break; }
    case "recipe-ing-back": renderRecipeModal(); break;
    case "rm-ing": captureRecipeForm(); editing.items.splice(parseInt(el.dataset.i),1); renderRecipeModal(); break;
    case "save-recipe": saveRecipe(); break;
    case "del-recipe": deleteRecipe(el.dataset.id); break;
    case "slot-change": openSlotPicker(el.dataset.slot); break;
    case "pick-sort":
      pickerCtx.sort = el.dataset.sort;
      overlay.querySelectorAll(".pick-chip").forEach(c=>c.classList.toggle("active", c.dataset.sort===pickerCtx.sort));
      document.getElementById("pick-list").innerHTML = pickListHTML();
      break;
    case "toggle-list-item": {
      const ing = el.dataset.ing;
      if(ing in state.list){ delete state.list[ing]; delete state.ticked[ing]; }
      else { addListItem(ing, parseFloat(el.dataset.q)); }
      save(); openSlotActions(el.dataset.slot, recipeById(el.dataset.recipe)); render();
      break;
    }
    case "add-all": { const n=addAllMissing(el.dataset.recipe); openSlotActions(el.dataset.slot, recipeById(el.dataset.recipe), n>0?tr("addedToList").replace("{n}", n):null); render(); break; }
    case "tick": tickItem(el.dataset.ing); break;
    case "untick": untickItem(el.dataset.ing); break;
    case "remove-item": removeListItem(el.dataset.ing); break;
    case "clear-list": clearList(); break;
    case "new-ingredient": openIngredientModal(null); break;
    case "edit-ingredient": openIngredientModal(el.dataset.ing); break;
    case "pick-ns": captureIngredientForm(); editingIng.ns = el.dataset.ns; renderIngredientModal(); break;
    case "auto-score": autoScoreLookup(); break;
    case "save-ingredient": saveIngredient(); break;
    case "ask-del-ingredient": confirmDeleteIngredient(el.dataset.ing); break;
    case "del-ingredient": deleteIngredient(el.dataset.ing); break;
    case "export": openExportModal(); break;
    case "import": openImportModal(); break;
    case "download-backup": downloadBackup(); break;
    case "copy-export": copyExport(el); break;
    case "do-import": doImport(); break;
    case "group": openGroupModal(); break;
    case "g-signin": cloudAuth(gval("g-email"), gval("g-pass", true), false); break;
    case "g-signup": cloudAuth(gval("g-email"), gval("g-pass", true), true); break;
    case "g-signout": cloudSignOut(); break;
    case "g-create": createGroup(gval("g-name")); break;
    case "g-join": joinGroup(gval("g-code")); break;
    case "g-switch": switchGroup(el.dataset.gid); break;
    case "g-personal": goPersonal(); break;
    case "g-share": shareInvite(); break;
    case "g-leave": if(!leaveArmed){ leaveArmed = true; renderGroupIfOpen(); } else { leaveArmed = false; leaveGroup(); } break;
    case "close": closeModal(); break;
  }
});

  if(e.target.id==="imp-file"){

/* Unified pointer drag (mouse + touch + pen):
   - calendar meals between days
   - shopping category headers to reorder aisles
   Categories use touch-action:none so a touch drags immediately; calendar cells
   keep normal scrolling and start a drag via long-press so quick swipes still scroll. */
let pdrag = null;
let lastDragEnd = 0;

function pdSource(target){
  if(!target || !target.closest) return null;
  const cell = target.closest(".mcell[data-draggable]");
  if(cell) return {kind:"meal", id:cell.dataset.slot, el:cell, targetSel:".mcell.day"};
  const head = target.closest(".cat-drag");
  if(head) return {kind:"cat", id:head.dataset.cat, el:head, targetSel:".catgroup[data-cat]"};
  return null;
}
function pdBegin(x,y){
  if(!pdrag || pdrag.active) return;
  pdrag.active = true;
  const el = pdrag.src.el, r = el.getBoundingClientRect();
  const g = el.cloneNode(true);
  g.classList.add("pdrag-ghost");
  g.style.width = r.width+"px"; g.style.left = r.left+"px"; g.style.top = r.top+"px";
  pdrag.offX = x-r.left; pdrag.offY = y-r.top; pdrag.ghost = g;
  document.body.appendChild(g);
  el.classList.add("dragging");
  document.body.classList.add("pdrag-active");
}
function pdMoveTo(x,y){
  const g = pdrag.ghost;
  g.style.left = (x-pdrag.offX)+"px"; g.style.top = (y-pdrag.offY)+"px";
  const under = document.elementFromPoint(x,y);          // ghost has pointer-events:none
  const tgt = under && under.closest ? under.closest(pdrag.src.targetSel) : null;
  let dropId = null, hl = null;
  if(tgt){
    dropId = pdrag.src.kind==="meal" ? tgt.dataset.slot : tgt.dataset.cat;
    hl = pdrag.src.kind==="meal" ? tgt : tgt.querySelector(".cat-drag");
    if(pdrag.src.kind==="cat" && dropId===pdrag.src.id){ dropId=null; hl=null; }
  }
  if(pdrag.overEl && pdrag.overEl!==hl) pdrag.overEl.classList.remove("dragover");
  if(hl) hl.classList.add("dragover");
  pdrag.overEl = hl; pdrag.dropId = dropId;
}
function pdCleanup(){
  if(pdrag && pdrag.ghost) pdrag.ghost.remove();
  if(pdrag && pdrag.longTimer) clearTimeout(pdrag.longTimer);
  document.querySelectorAll(".dragover,.dragging").forEach(c=>c.classList.remove("dragover","dragging"));
  document.body.classList.remove("pdrag-active");
}
function pdFinish(){
  if(!pdrag) return;
  const wasActive = pdrag.active, src = pdrag.src, dropId = pdrag.dropId;
  pdCleanup();
  const done = pdrag; pdrag = null;
  if(wasActive){
    lastDragEnd = Date.now();                              // suppress the click synthesized after a drag
    if(dropId){
      if(src.kind==="meal") moveMeal(src.id, dropId);
      else reorderCategory(src.id, dropId);
    }
  }
}
document.addEventListener("pointerdown", e=>{
  if(e.pointerType==="mouse" && e.button!==0) return;
  const src = pdSource(e.target);
  if(!src) return;
  pdrag = {src, startX:e.clientX, startY:e.clientY, active:false, longTimer:null};
  const touch = e.pointerType!=="mouse";
  if(touch && src.kind==="meal"){                          // long-press so a swipe still scrolls the calendar
    pdrag.longTimer = setTimeout(()=>{ if(pdrag && !pdrag.active) pdBegin(pdrag.startX, pdrag.startY); }, 250);
  }
}, {passive:true});
document.addEventListener("pointermove", e=>{
  if(!pdrag) return;
  const dist = Math.hypot(e.clientX-pdrag.startX, e.clientY-pdrag.startY);
  if(!pdrag.active){
    const touch = e.pointerType!=="mouse";
    if(!touch || pdrag.src.kind==="cat"){                  // mouse anywhere, or touch on a category header
      if(dist>6) pdBegin(e.clientX, e.clientY); else return;
    }else{
      if(dist>10) pdCleanup(), pdrag=null;                 // moved before long-press → it's a scroll
      return;
    }
  }
  if(pdrag && pdrag.active){ e.preventDefault(); pdMoveTo(e.clientX, e.clientY); }
}, {passive:false});
document.addEventListener("pointerup", pdFinish);
document.addEventListener("pointercancel", ()=>{ pdCleanup(); pdrag=null; });

// close modal when clicking backdrop
overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });

cloudBoot();   // restore the household's cached data if signed in before, then connect
render();
